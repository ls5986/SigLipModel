services:
  - type: web
    name: acq-vision-studio-dev
    runtime: python
    region: ohio
    plan: 0.5c-512mb
    branch: develop
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements-hosted.txt
    startCommand: python -B hosted_server.py
    healthCheckPath: /health
    envVars:
      - key: STUDIO_DATA_BACKEND
        value: supabase
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: STUDIO_DATABASE_URL
        sync: false
      - key: STUDIO_WORKSPACE_ID
        sync: false
      - key: STUDIO_STORAGE_SECRET
        sync: false
      - key: MLS_SOURCE_SUPABASE_URL
        value: https://uxlfqsgynbbgspaakzey.supabase.co
      - key: MLS_SOURCE_DATABASE_URL
        sync: false
      - key: TRESTLE_CLIENT_ID
        sync: false
      - key: TRESTLE_CLIENT_SECRET
        sync: false
      - key: STUDIO_PUBLIC_ORIGIN
        sync: false
      - key: STUDIO_LOGIN_USERNAME
        sync: false
      - key: STUDIO_LOGIN_PASSWORD
        sync: false
      - key: STUDIO_SESSION_SECRET
        generateValue: true
      - key: STUDIO_CACHE_DIR
        value: /tmp/acq-vision-cache
      - key: STUDIO_AUTOLABEL_PROVIDER
        value: hybrid
      - key: OPENAI_API_KEY
        sync: false
      - key: STUDIO_OPENAI_MODEL
        value: gpt-4.1-mini
      - key: STUDIO_OPENAI_MAX_CALLS_PER_DAY
        value: "100"

  - type: worker
    name: acq-vision-model-worker-dev
    runtime: python
    region: ohio
    plan: 1c-2g
    branch: develop
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements-worker.txt
    startCommand: python -B render_model_worker.py
    maxShutdownDelaySeconds: 300
    disk:
      name: acq-vision-model-worker-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: STUDIO_DATA_BACKEND
        value: supabase
      - key: ACQ_DATA_ROOT
        value: /var/data/siglip
      - key: STUDIO_CACHE_DIR
        value: /var/data/siglip/cloud-cache
      - key: STUDIO_AUTOLABEL_PROVIDER
        value: hybrid
      - key: STUDIO_INFERENCE_BATCH_SIZE
        value: "1"
      - key: SUPABASE_PROJECT_REF
        fromService:
          name: acq-vision-studio-dev
          type: web
          envVarKey: SUPABASE_PROJECT_REF
      - key: STUDIO_DATABASE_URL
        fromService:
          name: acq-vision-studio-dev
          type: web
          envVarKey: STUDIO_DATABASE_URL
      - key: STUDIO_WORKSPACE_ID
        fromService:
          name: acq-vision-studio-dev
          type: web
          envVarKey: STUDIO_WORKSPACE_ID
      - key: STUDIO_STORAGE_SECRET
        fromService:
          name: acq-vision-studio-dev
          type: web
          envVarKey: STUDIO_STORAGE_SECRET
      - key: MLS_SOURCE_SUPABASE_URL
        fromService:
          name: acq-vision-studio-dev
          type: web
          envVarKey: MLS_SOURCE_SUPABASE_URL
      - key: MLS_SOURCE_DATABASE_URL
        fromService:
          name: acq-vision-studio-dev
          type: web
          envVarKey: MLS_SOURCE_DATABASE_URL
      - key: TRESTLE_CLIENT_ID
        fromService:
          name: acq-vision-studio-dev
          type: web
          envVarKey: TRESTLE_CLIENT_ID
      - key: TRESTLE_CLIENT_SECRET
        fromService:
          name: acq-vision-studio-dev
          type: web
          envVarKey: TRESTLE_CLIENT_SECRET
