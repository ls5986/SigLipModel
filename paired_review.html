<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prior and last sale review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1723;color:#edf4fa;font:16px/1.5 system-ui}header{padding:18px 24px;border-bottom:1px solid #385068}h1{font-size:24px;margin:0}button,input,select,textarea{font:inherit;border:1px solid #648098;border-radius:8px;padding:10px;background:#142c40;color:inherit}button{cursor:pointer}button.primary{background:#416fec}button:disabled{opacity:.5;cursor:wait}.layout{display:grid;grid-template-columns:260px 1fr;gap:20px;padding:20px;max-width:1600px;margin:auto}aside{position:sticky;top:20px;align-self:start}aside input,aside select{width:100%;margin-bottom:10px}#list{max-height:75vh;overflow:auto}#list button{display:block;text-align:left;width:100%;margin-bottom:8px}#list button.selected{border-color:#90b0ff;background:#233d68}.muted{color:#aac0d2}.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#142536;border:1px solid #385068;border-radius:12px;padding:18px;min-width:0}.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photos img{width:100%;height:180px;object-fit:contain;background:#07121d;cursor:pointer}.photos select{font-size:13px;width:100%}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fact{background:#0b1b2b;padding:8px;border-radius:6px}.remarks{white-space:pre-wrap;max-height:240px;overflow:auto}.callout{font-size:14px;background:#243d52;padding:6px 9px;border-radius:8px;margin:6px 0}.decision{display:grid;gap:8px;border-top:1px solid #385068;margin-top:16px;padding-top:14px}.buttons{display:flex;gap:6px;flex-wrap:wrap}.buttons button.chosen{background:#355ee2;border-color:#b9c9ff}input[type=range]{width:100%}label{display:grid;gap:5px;margin:12px 0}textarea{width:100%;min-height:70px}details{margin-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:280px;overflow:auto}.notice{background:#253951;border-radius:8px;padding:10px;margin:12px 0}.error{color:#ffb1b1}.top{display:flex;justify-content:space-between;gap:12px}.save{position:sticky;bottom:0;background:#0b1723;padding:15px;display:flex;gap:10px;align-items:center}.lightbox{position:fixed;inset:0;background:#000e;z-index:9;display:grid;place-items:center}.lightbox img{max-height:88vh;max-width:95vw}.lightbox button{position:absolute;right:18px;top:18px}[hidden]{display:none!important}@media(max-width:950px){.layout{display:block;padding:12px}aside{position:static}#list{max-height:180px}.panels{grid-template-columns:1fr}.photos img{height:220px}.save{flex-wrap:wrap}}</style>
<header><h1>Prior and last sale review</h1><div class="muted">Photos and metadata get separate decisions. Both sales stay with the same property.</div></header>
<div class="layout"><aside><input id="search" placeholder="Address, APN or MLS"><select id="filter"><option value="priority">Protected and paired first</option><option value="all">All properties</option><option value="pairs">Both MLS listings</option><option value="protected">Protected review</option><option value="remaining">No saved review yet</option></select><p id="count"></p><div id="list"></div></aside><main><div class="top"><h2 id="address">Loading corrected workbook…</h2><button id="next">Next property</button></div><p id="identity" class="muted"></p><div id="notice" class="notice"></div><div id="panels" class="panels"></div><div class="save"><button id="save" class="primary">Save both → Next</button><span id="status" role="status"></span></div></main></div>
<div id="lightbox" class="lightbox" hidden><button id="close">Close</button><img id="full" alt="Selected listing photo"></div>
<script>
const $=id=>document.getElementById(id);let items=[],current=null,token='',answers={},busy=false;
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
async function api(path,body){const r=await fetch('/api/studio/paired-review/'+path,body?{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function available(v){return v&&v!=='None'}
function filtered(){const q=$('search').value.toLowerCase();return items.filter(i=>(i.address+' '+i.normalized_apn+' '+i.prior_mls+' '+i.last_mls).toLowerCase().includes(q)&&($('filter').value!=='pairs'||(available(i.prior_mls)&&available(i.last_mls)))&&($('filter').value!=='protected'||i.protected_review)&&($('filter').value!=='remaining'||!i.reviewed))}
function list(){const rows=filtered();$('count').textContent=rows.length+' of '+items.length+' properties';$('list').replaceChildren();rows.forEach(i=>{const b=node('button',i.address+(i.protected_review?' · Protected review':'')+(i.reviewed?' · Saved':''));b.classList.toggle('selected',current?.group_id===i.group_id);b.onclick=()=>load(i.group_id);$('list').append(b)})}
function select(label,choices,value,parent,onchange){const wrap=node('label',label),s=node('select');choices.forEach(([v,t])=>{const o=node('option',t);o.value=v;s.append(o)});s.value=value;s.onchange=()=>onchange(s.value);wrap.append(s);parent.append(wrap);return s}
function axis(card,key,a){const box=node('div',undefined,'decision');box.append(node('strong',key==='image'?'Photos':'Metadata and remarks'));const btns=node('div',undefined,'buttons'),range=node('input'),value=node('span');range.type='range';range.min=50;range.max=100;range.step=5;range.value=a[key].strength||75;const buttons=[];function refresh(){buttons.forEach(([d,b])=>b.classList.toggle('chosen',a[key].decision===d));range.hidden=value.hidden=a[key].decision!=='TARGET';value.textContent=range.value+'% target strength';}['TARGET','NOT_TARGET','INSUFFICIENT_EVIDENCE'].forEach(d=>{const b=node('button',d==='INSUFFICIENT_EVIDENCE'?'Cannot tell':d.replace('_',' '));b.onclick=()=>{a[key]={decision:d,strength:d==='TARGET'?Number(range.value):null};refresh()};buttons.push([d,b]);btns.append(b)});range.oninput=()=>{a[key].strength=Number(range.value);refresh()};box.append(btns,range,value);refresh();card.append(box)}
function panel(e){const card=node('section',undefined,'card'),prior=e.event_role==='acquisition';card.append(node('h3',prior?'Prior sale · potential TARGET':'Last sale · potential NOT TARGET'));card.append(node('p',e.listing_key?e.listing_id+' / '+e.listing_key+' · '+(e.standard_status||'Status unknown'):'No matched MLS', 'muted'));card.append(node('p','Source sale: '+String(e.close_date||'unknown')+' · Recorded: '+String(e.recording_date||'unknown')));card.append(node('div','Role: '+e.decision+' · Date gap: '+String(e.audit[prior?'Prior_Date_Gap_Days':'Last_Date_Gap_Days']??'unknown')+' days'+((e.audit.reasons||[]).length?' · '+e.audit.reasons.join(', '):''),'notice'));
 if(!e.evidence_id){card.append(node('p','No listing evidence to score. This stays UNKNOWN, not NOT TARGET.'));return card}
 const r=e.review||{},a={group_id:current.group_id,evidence_id:e.evidence_id,role_id:e.role_id,expected_revision:e.revision,overall:r.overall?.decision||(prior?'TARGET':'NOT_TARGET'),image:r.image||{decision:null,strength:null},metadata:r.metadata||{decision:null,strength:null},notes:r.notes?.text||'',role_decision:e.decision==='human_confirmed'?'human_confirmed':'',condition:r.condition?.decision||'UNKNOWN',modernization:r.modernization?.decision||'UNKNOWN',excluded_photos:r.photo_exclusions?.excluded||{},private_signal_reviews:{}};answers[e.evidence_id]=a;
 select('Overall result (suggested until saved)',[['TARGET','TARGET'],['NOT_TARGET','NOT TARGET']],a.overall,card,v=>a.overall=v);
 select('Is this the correct property and sale era?',[['','Choose when reviewing'],['human_confirmed','Yes, correct property and era'],['wrong_property','Wrong property'],['wrong_era','Wrong sale era'],['ambiguous','Unclear / ambiguous'],['provider_error','Listing evidence problem']],a.role_decision,card,v=>a.role_decision=v);
 if(e.previous_review)card.append(node('div','Your earlier review for this MLS is preserved: photos '+e.previous_review.image_decision+', metadata '+e.previous_review.metadata_decision+'. Recheck the current evidence before saving here.','notice'));
 const photos=node('div',undefined,'photos');(e.photo_manifest||[]).forEach(p=>{const box=node('div'),img=node('img');const url='/api/studio/paired-review/image?evidence='+encodeURIComponent(e.evidence_id)+'&photo='+p.sha256;img.src=url+'&thumbnail=1';img.loading='lazy';img.alt='Photo from MLS '+p.listing_key;img.onclick=()=>{$('full').src=url;$('lightbox').hidden=false};box.append(img);select('Photo use',[['','Use as review evidence'],['floor_plan','Ignore: floor plan'],['virtual_staging','Ignore: AI / virtual staging'],['shared_amenity','Ignore: shared amenity'],['unrelated','Ignore: unrelated']],a.excluded_photos[p.sha256]||'',box,v=>{if(v)a.excluded_photos[p.sha256]=v;else delete a.excluded_photos[p.sha256]});photos.append(box)});card.append(photos);if(!e.photo_manifest?.length)card.append(node('p','No stored photos. Choose Cannot tell for photos.','notice'));
 const facts=node('div',undefined,'facts'),raw=e.raw_snapshot||{};[['YearBuilt','Year built'],['PropertySubType','Type'],['BedroomsTotal','Beds'],['BathroomsTotalInteger','Baths'],['LivingArea','Living area'],['ListPrice','List price'],['SpecialListingConditions','Special conditions'],['PropertyCondition','Condition'],['ListingTerms','Terms'],['OccupantType','Occupancy']].forEach(([key,label])=>facts.append(node('div',label+': '+(raw[key]??'Missing'),'fact')));card.append(node('h4','Listing metadata'),facts);
 ['PublicRemarks','PrivateRemarks'].forEach(f=>{card.append(node('h4',f==='PublicRemarks'?'Description':'Private remarks'));card.append(node('div',raw[f]||'Not available in stored evidence','remarks'));(e.signals||[]).filter(s=>s.source_field===f).forEach(s=>{const call=node('div',s.signal_name.replaceAll('_',' ')+' · '+s.state+' · “'+s.snippet+'” · draft','callout');if(f==='PrivateRemarks')select('Optional text-signal review',[['','Leave as draft'],['PRESENT','Confirm PRESENT'],['ABSENT','Confirm ABSENT'],['UNKNOWN','Unknown']],r['private_signal:'+s.signal_id]?.decision||'',call,v=>{if(v)a.private_signal_reviews[s.signal_id]=v;else delete a.private_signal_reviews[s.signal_id]});card.append(call)})});
 axis(card,'image',a);axis(card,'metadata',a);
 const optional=node('details');optional.append(node('summary','Optional condition and modernization labels'));select('Physical condition',[['UNKNOWN','Unknown'],['C1_NEW','C1 New'],['C2_LIKE_NEW','C2 Like new'],['C3_WELL_MAINTAINED','C3 Well maintained'],['C4_AVERAGE_FUNCTIONAL','C4 Average functional'],['C5_REHAB_NEEDED','C5 Rehab needed'],['C6_SEVERE_DISTRESS','C6 Severe distress']],a.condition,optional,v=>a.condition=v);select('Modernization',[['UNKNOWN','Unknown'],['ORIGINAL','Original'],['PARTIALLY_UPDATED','Partially updated'],['UPDATED','Updated'],['FULLY_REMODELED','Fully remodeled']],a.modernization,optional,v=>a.modernization=v);card.append(optional);
 const notes=node('textarea');notes.placeholder='Optional notes';notes.value=a.notes;notes.maxLength=4000;notes.oninput=()=>a.notes=notes.value;card.append(notes);const details=node('details');details.append(node('summary','Stored MLS JSON and match audit'),node('pre',JSON.stringify({listing:raw,audit:e.audit,feature_policy:e.metadata_snapshot},null,2)));card.append(details);return card}
async function load(id){if(busy)return;try{current=await api('property?id='+encodeURIComponent(id));answers={};$('address').textContent=current.address;$('identity').textContent='APN '+current.apn+(current.unit?' · Unit '+current.unit:'');$('notice').textContent=current.warning;$('panels').replaceChildren(...current.events.map(panel));$('status').textContent='';$('save').disabled=!Object.keys(answers).length;list()}catch(e){$('status').textContent=e.message;$('status').className='error'}}
async function next(){const rows=filtered(),i=rows.findIndex(x=>x.group_id===current?.group_id);if(i+1<rows.length)await load(rows[i+1].group_id);else $('status').textContent='End of this list. You can change the filter or revisit any property.'}
$('save').onclick=async()=>{if(busy)return;const rows=Object.values(answers);if(rows.some(a=>!a.image.decision||!a.metadata.decision||!a.role_decision)){$('status').textContent='Make both decisions and verify the sale era for each available listing.';return}busy=true;$('save').disabled=true;try{for(const a of rows){const r=await api('save',a);a.expected_revision=r.revision}const i=items.find(x=>x.group_id===current.group_id);if(i)i.reviewed=true;$('status').textContent='Saved';busy=false;await next()}catch(e){$('status').textContent=e.message;$('status').className='error'}finally{busy=false;$('save').disabled=false}};
$('next').onclick=next;$('search').oninput=list;$('filter').onchange=list;$('close').onclick=()=>{$('lightbox').hidden=true;$('full').removeAttribute('src')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('close').click()});
(async()=>{try{const d=await api('list');items=d.items;token=d.token;list();if(items.length)await load(items[0].group_id);else $('address').textContent='No corrected properties staged'}catch(e){$('address').textContent=e.message}})();
</script></html>
