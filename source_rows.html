<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACQ Vision · Workbook rows</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f4ef;color:#242424;font:15px/1.5 Segoe UI,sans-serif}main{max-width:1100px;margin:24px auto;padding:0 16px}a{color:#b11f4b}h1{font-size:26px}button,input,select,textarea{font:inherit;padding:9px;border:1px solid #ccc;border-radius:8px;background:white;max-width:100%}.tools{display:flex;gap:12px;flex-wrap:wrap}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:18px;margin:16px 0;overflow-wrap:anywhere}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.muted{color:#666}textarea{width:100%;min-height:70px}label{display:block;margin:10px 0}details{margin:12px 0}summary{cursor:pointer;font-weight:600}.error{color:#a12622}@media(max-width:600px){.facts{grid-template-columns:1fr}.tools>*{width:100%}}</style></head>
<body><main><a href="/">Back to photo verification</a><h1>All workbook rows</h1><p>These are known target examples. Verify the correct acquisition sale and its photos. Unresolved rows stay here until their evidence can be recovered. Repeated parcels remain separate source rows.</p>
<p id="counts">Loading…</p><form id="search-form" class="tools"><input id="search" aria-label="Search source rows" placeholder="Address, listing key or row"><select id="filter" aria-label="Evidence status"><option value="all">All rows</option><option value="verify">Ready to verify</option><option value="verified">Sale/photos verified</option><option value="rematch">Needs acquisition rematch</option><option value="missing_photos">Missing photos</option></select><button>Search</button></form>
<p id="message" role="status"></p><div id="rows"></div><div class="tools"><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let offset=0,total=0,token=null;
const labels={verify:'Ready to verify sale and photos',verified:'Sale and photos verified',rematch:'Needs correct acquisition listing',missing_photos:'Acquisition match found; photos missing'};
const node=(tag,text)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;return n;};
async function api(path,body){const r=await fetch('/api/studio/'+path,{credentials:'same-origin',cache:'no-store',...(body?{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data;}
async function load(){try{const data=await api('source-rows?'+new URLSearchParams({offset,limit:20,search:$('search').value,status:$('filter').value}));total=data.total;$('counts').textContent=`${data.source_rows} source rows · ${data.counts.verified} verified · ${data.counts.verify} ready to verify · ${data.counts.rematch} need rematching · ${data.counts.missing_photos} missing photos`;$('rows').replaceChildren();
for(const item of data.items){const card=node('section');card.className='card';card.append(node('h2',`Row ${item.source_row} · ${item.address}`),node('p',`${labels[item.status]} · ${item.photo_count} retained photos · ${item.photo_coverage==='no_interior'?'No interior photos':item.photo_coverage==='interior_available'?'Interior photos available':'Interior coverage not recorded'}`));const source=node('div');source.className='facts';for(const key of ['Prior Sale Date','Last Sale Date','APN','County','City','State'])if(item.source[key]!=null)source.append(node('div',`${key}: ${item.source[key]}`));card.append(source);
if(item.listing_key&&item.photo_count){const link=node('a','Open listing metadata and verify photo set');link.href='/?property='+encodeURIComponent(item.listing_key);card.append(link);}
const candidates=node('details');candidates.append(node('summary',`Stored MLS candidates (${item.candidates.length})`));for(const c of item.candidates){const m=c.listing;const p=node('p',`${m.ListingKey||m.ListingId||'Unknown listing'} · ${m.UnparsedAddress||''} · ${m.StandardStatus||'Unknown status'} · closed ${m.CloseDate||'date unknown'} · ${c.prior_supported?'passes acquisition-match checks':'acquisition match needs review'}`);candidates.append(p);}card.append(candidates);
const form=node('form');form.append(node('p','Correction notes preserve your findings. They do not replace the listing or mark missing photos as verified.'));const label=node('label','Your name');const name=node('input');name.required=true;name.maxLength=100;name.value=localStorage.getItem('sourceReviewer')||'';label.append(name);const noteLabel=node('label','Correct listing ID, sale date or what needs fixing');const notes=node('textarea');notes.required=true;notes.maxLength=2000;notes.value=item.verification_note.note||'';noteLabel.append(notes);const save=node('button','Save correction note');form.append(label,noteLabel,save);form.onsubmit=async e=>{e.preventDefault();save.disabled=true;try{const result=await api('source-row-note',{source_row:item.source_row,reviewer:name.value,note:notes.value,expected_revision:item.verification_note.revision||0});item.verification_note=result;localStorage.setItem('sourceReviewer',name.value);$('message').textContent=`Correction note saved for row ${item.source_row}.`;}catch(error){$('message').textContent=error.message;}finally{save.disabled=false;}};const notesSection=node('details');notesSection.append(node('summary','Record a correction'),form);card.append(notesSection);$('rows').append(card);}
$('page').textContent=total?`${offset+1}–${Math.min(offset+20,total)} of ${total}`:'No matching rows';$('previous').disabled=offset===0;$('next').disabled=offset+20>=total;}catch(error){$('message').textContent=error.message;$('message').className='error';}}
$('search-form').onsubmit=e=>{e.preventDefault();offset=0;load();};$('filter').onchange=()=>{offset=0;load();};$('previous').onclick=()=>{offset=Math.max(0,offset-20);load();};$('next').onclick=()=>{offset+=20;load();};api('summary').then(data=>{token=data.token;return load();}).catch(error=>{$('message').textContent=error.message;});})();
</script></body></html>
