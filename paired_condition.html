<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{color-scheme:dark;--bg:#0c1622;--card:#152536;--line:#2b4055;--text:#edf4fa;--muted:#a7b7c6;--blue:#6f94ff;--green:#67d4b7;--red:#f69c9c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a.button{border:1px solid var(--line);background:#20374d;color:var(--text);padding:9px 15px;border-radius:8px;cursor:pointer;text-decoration:none}button.primary{background:#4167d2;border-color:#4167d2}button:disabled{opacity:.45;cursor:default}button:hover:not(:disabled){filter:brightness(1.15)}a{color:#adc3ff}header{padding:20px max(20px,calc((100vw - 1400px)/2));border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:26px;margin:0}h2{font-size:22px;margin:0 0 8px}h3{font-size:17px;margin:0 0 10px}p{margin:8px 0}.muted{color:var(--muted)}.small{font-size:13px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.wrap{max-width:1400px;margin:auto;padding:24px}.layout>*{min-width:0}.evidence>*{min-width:0}.layout{display:grid;grid-template-columns:260px 1fr;gap:24px}.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}.list{max-height:65vh;overflow:auto}.listing{display:block;width:100%;text-align:left;margin:7px 0;background:transparent}.listing.selected{border-color:var(--blue);background:#243c60}.listing span{display:block;font-size:12px;color:var(--muted)}input,select,textarea{background:#0e1d2c;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px;max-width:100%}input[type=search]{width:100%;margin:12px 0}.status{margin:0 0 20px;padding:14px 18px;background:#162c3a;border-radius:9px;border:1px solid var(--line)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.score{border:1px solid var(--line);border-radius:10px;padding:14px}.score strong{display:block;font-size:21px}.target{color:var(--green)}.not-target{color:var(--red)}.evidence{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}.hero{width:100%;height:380px;object-fit:contain;background:#060b11;border-radius:8px}.thumbs{display:flex;gap:8px;overflow:auto;padding:12px 0}.thumbs button{padding:0;flex-shrink:0;border-radius:5px;overflow:hidden}.thumbs img{width:75px;height:62px;object-fit:cover;display:block}.thumbs .active{outline:2px solid var(--blue)}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.fact{background:#102030;padding:8px;border-radius:6px}.fact span{display:block;font-size:12px;color:var(--muted)}.remarks{white-space:pre-wrap;font-size:14px;max-height:260px;overflow:auto}.decision-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.decision-fields label{display:block;font-size:14px;margin-bottom:7px}.decision-fields select{width:100%}.decision-fields input{width:85px;margin-top:8px}.review{margin-top:20px}textarea{width:100%;min-height:70px}.pill{padding:3px 9px;border:1px solid var(--line);border-radius:15px;color:var(--muted);font-size:12px}.error{color:#ffc0c0;background:#442a32}.success{color:var(--green)}#message{position:sticky;top:8px;z-index:2;border-radius:7px}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}details{margin:12px 0}summary{cursor:pointer;color:#b5cafa}.empty{padding:60px 20px;text-align:center;color:var(--muted)}.loading{opacity:.65;pointer-events:none}
@media(max-width:950px){.layout{grid-template-columns:1fr}.list{max-height:170px}.evidence{grid-template-columns:1fr}.hero{height:330px}.wrap{padding:14px}.cards{gap:7px}.score{padding:10px}.score strong{font-size:17px}.decision-fields{grid-template-columns:1fr 1fr}.facts{grid-template-columns:repeat(2,1fr)}header{padding:15px;align-items:flex-start;flex-wrap:wrap}header h1{font-size:21px}}@media(max-width:500px){.cards{grid-template-columns:1fr}.score strong{display:inline;margin-left:10px}.decision-fields{grid-template-columns:1fr}.hero{height:280px}}
</style></head><body>
<header><div><h1>ACQ Vision · Test your model</h1><div class="muted small">Dated or original = TARGET · Fully updated = NOT TARGET</div></div><div class="bar"><a href="/paired-review">Reference review</a><a href="/status">Status</a></div></header>
<main class="wrap"><div id="message" role="status" aria-live="polite"></div><div class="status"><div class="bar" style="justify-content:space-between"><div><strong id="trainingStatus">Loading model status…</strong><div id="trainingDetail" class="muted small"></div></div><button id="train" class="primary">Train next version</button></div><details><summary>Model results and dataset</summary><div id="modelInfo" class="small"></div></details></div>
<div class="layout"><aside class="panel"><h3>Your properties <span id="count" class="muted small"></span></h3><input id="search" type="search" placeholder="Address or MLS ID" aria-label="Search properties"><label class="small" for="reviewFilter">Review status</label><select id="reviewFilter" style="width:100%"><option value="all">All</option><option value="unreviewed">Not reviewed</option><option value="reviewed">Reviewed</option></select><label class="small"><input id="showMissingMLS" type="checkbox"> Show properties needing MLS</label><div id="properties" class="list"></div></aside><section id="property" class="panel"><div class="empty">Choose a property to see its photos, listing facts and model result.</div></section></div></main>
<script>
(function(root){const api={version:'opportunity-estimate-v1',calculate({purchase,resale,rehab=null,costs=null}){if(!Number.isFinite(purchase)||!Number.isFinite(resale)||purchase<=0||resale<=0)throw Error('Positive purchase and resale values required');for(const cost of [rehab,costs])if(cost!==null&&(!Number.isFinite(cost)||cost<0))throw Error('Costs must be nonnegative');const grossUpside=resale-purchase;return {grossUpside,discountPercent:100*grossUpside/resale,remainingMargin:rehab===null||costs===null?null:grossUpside-rehab-costs};}};if(typeof module==='object'&&module.exports)module.exports=api;else root.OpportunityMath=api;})(typeof globalThis!=='undefined'?globalThis:this);
</script>
<script>
'use strict';
const API='/api/studio/paired-condition/';let token='',status={},items=[],current=null,eventIndex=0,photoIndex=0,photoList=[],excluded=null,dirty=false,pending=false;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={TARGET:'TARGET',NOT_TARGET:'NOT TARGET',INSUFFICIENT_EVIDENCE:'Cannot tell'};
const decision=value=>typeof value==='string'?{decision:value}:value||{decision:'INSUFFICIENT_EVIDENCE'};
function message(text,error=false){$('message').className=error?'status error':'status success';$('message').textContent=text;}
async function api(path,body){const response=await fetch(API+path,body?{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(body)}:{});const result=await response.json();if(!response.ok)throw Error(result.error||'Request failed');return result;}
function dollars(v){const n=Number(v);return v==null||v===''||!Number.isFinite(n)?'—':n.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});}
function number(v){return v==null||v===''?'—':String(v);}
function event(){return current?.events?.[eventIndex];}
async function refreshStatus(){status=await api('status');token=status.token;const req=status.request||{},candidate=status.candidate;
 const active=['queued','running'].includes(req.status);$('train').disabled=active;
 $('trainingStatus').textContent=active?'Training '+(req.dataset_version?'version '+req.dataset_version:'your model')+'…':req.status==='failed'?'Training needs attention':candidate?'Candidate ready to test':'Frozen dataset ready';
 $('trainingDetail').textContent=active?((status.progress?.stage||'queued').replaceAll('_',' ')):req.status==='failed'?(req.reason||'Saved data is preserved.'):(candidate?'Separate photo, remarks and structured-field models. Experimental match strengths are not probabilities.':'Train the first candidate from the frozen reference set.');
 const models=candidate?.components||{};let info=`Dataset ${esc(status.dataset?.version)} · ${esc(status.dataset?.name)}<br>`;
 if(candidate){info+=`Trained ${esc(new Date(candidate.created_at).toLocaleString())} · ${esc(candidate.training_groups)} training groups<br>`;info+=Object.entries(models).map(([k,v])=>`${esc(k)}: ${v?'trained':'insufficient labels'}`).join(' · ');const ev=candidate.evaluation||{};for(const split of ['validation','test']){const a=ev[split]?.overall;info+=`<br>${split==='test'?'Held-out test':'Validation'}: ${a?.assessed||0} assessed, ${a?.abstained||0} uncertain${a?.agreement!=null?' · '+Math.round(100*a.agreement)+'% agreement with automated labels':''}`;}info+='<br>This measures agreement with automated labels, not independent human accuracy. Corrections are saved for the next version.';}
 $('modelInfo').innerHTML=info;
}
function hasMLS(v){return v!=null&&!['','none','null','nan'].includes(String(v).trim().toLowerCase());}
function visibleItems(){const q=$('search').value.toLowerCase(),filter=$('reviewFilter').value;return items.filter(x=>($('showMissingMLS').checked||hasMLS(x.prior_mls)||hasMLS(x.last_mls))&&(filter==='all'||Boolean(x.reviewed)===(filter==='reviewed'))&&[x.address,x.prior_mls,x.last_mls].join(' ').toLowerCase().includes(q));}
function renderList(){const visible=visibleItems();$('count').textContent=`${visible.length} / ${items.length}`;$('properties').innerHTML=visible.map(x=>`<button class="listing ${current?.group_id===x.group_id?'selected':''}" data-group="${esc(x.group_id)}">${esc(x.address)}<span>Prior ${esc(hasMLS(x.prior_mls)?x.prior_mls:'MLS not assigned')} · Last ${esc(hasMLS(x.last_mls)?x.last_mls:'MLS not assigned')}</span><span>${x.reviewed?'Reviewed':'Not reviewed'}</span></button>`).join('')||'<p class="small muted">No properties match these filters.</p>';$('properties').querySelectorAll('button').forEach(b=>b.onclick=()=>loadProperty(b.dataset.group));}
async function loadProperty(group){if(dirty){message('Save your correction before moving to another property.',true);return;}$('property').classList.add('loading');try{current=await api('property?id='+encodeURIComponent(group));eventIndex=0;photoIndex=0;excluded=null;render();renderList();}catch(e){message(e.message,true);}finally{$('property').classList.remove('loading');}}
function card(title,value){value=decision(value);const cls=value.decision==='TARGET'?'target':value.decision==='NOT_TARGET'?'not-target':'muted';return `<div class="score"><span class="muted small">${esc(title)}</span><strong class="${cls}">${esc(names[value.decision]||'Cannot tell')}</strong>${value.decision==='TARGET'&&value.strength!=null?`<span class="small">${esc(value.strength)} / 100 match strength</span>`:''}</div>`;}
function options(selected){return ['TARGET','NOT_TARGET','INSUFFICIENT_EVIDENCE'].map(v=>`<option value="${v}" ${v===selected?'selected':''}>${names[v]}</option>`).join('');}
function render(){const ev=event();if(!ev){$('property').innerHTML='<div class="empty">No listing evidence is stored for this property yet.</div>';return;}const pred=ev.prediction?.status==='completed'?ev.prediction:null,reference=ev.silver_reference,review=ev.review||{},meta=ev.metadata_snapshot?.structured||{},raw=ev.raw_snapshot||{};
 const oldExcluded=review.photo_exclusions?.excluded||{};if(excluded===null)excluded={...oldExcluded};
 const tags=new Map((ev.photo_tags||[]).map(p=>[p.sha256,p]));for(const p of pred?.excluded_photos||[])tags.set(p.sha256,{...(tags.get(p.sha256)||{}),exclusion:p.reason});
 photoList=(ev.photo_manifest||[]).filter(p=>!excluded[p.sha256]&&(!tags.get(p.sha256)?.exclusion||tags.get(p.sha256).exclusion==='none'));
 photoIndex=Math.min(photoIndex,Math.max(0,photoList.length-1));const img=decision(review.image||pred?.image||reference?.image),metadata=decision(review.metadata||pred?.metadata||reference?.metadata),overall=decision(review.overall||pred?.overall||reference?.overall);
 const value=k=>meta[k]??raw[k],original=Number(value('OriginalListPrice')),listed=Number(value('ListPrice')),previous=Number(value('PreviousListPrice'));
 const pricesKnown=value('OriginalListPrice')!=null&&value('ListPrice')!=null&&original>0&&listed>0;
 const reduction=pricesKnown&&original>listed?`${dollars(original-listed)} · ${((original-listed)/original*100).toFixed(1)}%`:pricesKnown?'No net reduction':'Unavailable';
 const facts=[['Year built',meta.YearBuilt],['Beds / baths',`${number(meta.BedroomsTotal)} / ${number(meta.BathroomsTotalInteger)}`],['Living area',meta.LivingArea],['Type',meta.PropertySubType||meta.PropertyType],['Saved list price',dollars(value('ListPrice'))],['Original list price',dollars(value('OriginalListPrice'))],['Total reduction',reduction],['Latest recorded reduction',previous>listed&&listed>0?dollars(previous-listed):'Unavailable'],['Price change date',value('PriceChangeTimestamp')||'Unavailable'],['Reduction count','History unavailable'],['Days on market',meta.DaysOnMarket],['HOA fee',dollars(meta.AssociationFee)],['Property condition',Array.isArray(meta.PropertyCondition)?meta.PropertyCondition.join(', ')||'—':meta.PropertyCondition||'—']];
 const photoHint=pred?.photos?.find(p=>p.sha256===photoList[photoIndex]?.sha256);
 const controls=current.events.map((x,i)=>`<button data-event="${i}" ${i===eventIndex?'class="primary"':''}>${x.event_role==='acquisition'?'Prior sale':'Last sale'} · ${esc(x.listing_id||x.listing_key||'missing MLS')}</button>`).join('');
 const canPredict=Boolean(ev.evidence_id&&status.candidate),requestActive=['queued','running'].includes(ev.request?.status);
 $('property').innerHTML=`<div class="bar" style="justify-content:space-between"><h2>${esc(current.address)}</h2><button id="next">Next property →</button></div><div class="bar">${controls}</div><p class="small muted">MLS ${esc(ev.listing_key||'unavailable')} · Sale ${esc(ev.close_date||'date unavailable')}${ev.decision==='ambiguous'?' · Possible match':''}${pred?.evaluation_context==='train'?' · Training example':pred?.evaluation_context==='test'?' · Held-out example':''}</p>
 <div class="bar"><button id="run" class="primary" ${canPredict&&!requestActive?'':'disabled'}>${requestActive?'Scoring…':'Score with current model'}</button><span class="muted small">${pred?'Trained candidate result':reference?'Automated reference labels shown until candidate results are ready':'No model result yet'}</span></div>
 ${review.overall&&!dirty?`<h3>Your saved assessment</h3><div class="cards">${card('Photos',review.image)}${card('Metadata + remarks',review.metadata)}${card('Overall',{...decision(review.overall),strength:Math.max(review.image?.decision==='TARGET'?review.image.strength||50:0,review.metadata?.decision==='TARGET'?review.metadata.strength||50:0)||null})}</div>`:''}<h3>Current model prediction</h3><p class="small muted">Corrections below are your assessment. Saving them does not change this model prediction; they enter the next training version.</p><div class="cards">${card('Photos',pred?.image)}${card('Metadata + remarks',pred?.metadata)}${card('Overall',pred?.overall)}</div>
 <div class="evidence"><div><div id="gallery"></div><div class="bar"><span id="photoResult" class="muted small"></span><button id="exclude" ${photoList.length?'':'disabled'}>Exclude as staged / artificial</button></div><p class="muted small">${(ev.photo_manifest||[]).length-photoList.length} photos excluded from this gallery. Floor plans and unrelated images do not drive the image result.</p><details><summary>All stored photos / exclusions</summary><div id="allPhotos"></div></details></div>
 <div><h3>Listing facts</h3><div class="facts">${facts.map(([k,v])=>`<div class="fact"><span>${esc(k)}</span>${esc(number(v))}</div>`).join('')}</div>${remarkSummary(ev)}<details><summary>Full public remarks</summary><div class="remarks">${esc(ev.metadata_snapshot?.public_remarks||raw.PublicRemarks||'No public remarks stored')}</div></details><details><summary>Private remarks ${raw.PrivateRemarks?'':'(not available)'}</summary><div class="remarks">${esc(raw.PrivateRemarks||'No private remarks in this saved record')}</div></details>
 ${reference?.metadata?.supporting_quotes?.length?`<p class="small"><strong>Listing evidence:</strong> ${reference.metadata.supporting_quotes.map(q=>'“'+esc(q)+'”').join(' · ')}</p>`:''}${metadataExplanation(pred,meta)}<details><summary>Full saved MLS JSON</summary><pre>${esc(JSON.stringify(raw,null,2))}</pre></details><p class="small muted">Price drops and sale figures are context. They do not establish whether the home is dated.</p></div></div>
 ${opportunityUI()}<div class="review"><h3>Your correction</h3><p class="small muted">50 = weak target · 100 = strong target. Target strength is not confidence. Initial fields come from your saved assessment, then the model, then an automated reference.</p><div class="decision-fields"><div><label for="imageDecision">Photos</label><select id="imageDecision">${options(img.decision)}</select><label>Target strength <input id="imageStrength" type="number" min="50" max="100" value="${img.strength??50}"></label></div><div><label for="metadataDecision">Metadata + remarks</label><select id="metadataDecision">${options(metadata.decision)}</select><label>Target strength <input id="metadataStrength" type="number" min="50" max="100" value="${metadata.strength??50}"></label></div><div><label for="overallDecision">Overall</label><select id="overallDecision">${options(overall.decision)}</select></div></div><label for="notes" class="small muted">Why? (optional)</label><textarea id="notes" maxlength="4000" placeholder="For example: original kitchen despite new paint">${esc(review.notes?.text||'')}</textarea><div class="bar"><button id="save" class="primary" ${ev.evidence_id?'':'disabled'}>Save correction</button><button id="saveNext" ${ev.evidence_id?'':'disabled'}>Save and next →</button><span class="small muted">Saved corrections enter the next training version. This frozen dataset stays intact.</span></div></div>`;
 $('property').querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{if(dirty){message('Save your correction before switching listings.',true);return;}eventIndex=Number(b.dataset.event);photoIndex=0;excluded=null;render();});
 $('next').onclick=nextProperty;$('run').onclick=runModel;$('save').onclick=()=>saveCorrection(false);$('saveNext').onclick=()=>saveCorrection(true);$('exclude').onclick=()=>{const p=photoList[photoIndex];if(p){excluded[p.sha256]='virtual_staging';dirty=true;captureAndRender();}};
 for(const id of ['imageDecision','metadataDecision','overallDecision','imageStrength','metadataStrength','notes'])$(id).oninput=()=>{dirty=true;if(['imageDecision','metadataDecision'].includes(id))suggestOverall();strengthState();};
 setupOpportunity();strengthState();renderGallery();$('allPhotos').innerHTML=(ev.photo_manifest||[]).map((p,i)=>`<div class="bar small" style="margin:6px 0">Photo ${i+1}: ${esc(excluded[p.sha256]||tags.get(p.sha256)?.exclusion||'unclassified')} ${excluded[p.sha256]?`<button data-include="${esc(p.sha256)}">Remove my exclusion</button>`:''}</div>`).join('');$('allPhotos').querySelectorAll('[data-include]').forEach(b=>b.onclick=()=>{delete excluded[b.dataset.include];dirty=true;captureAndRender();});
}
const modelFields=['YearBuilt','LivingArea','BedroomsTotal','BathroomsTotalInteger','LotSizeSquareFeet','AssociationFee','PropertyType','PropertySubType','PropertyAttachedYN','AssociationYN','Appliances','Flooring','Heating','Cooling','Roof','ConstructionMaterials','Sewer','PropertyCondition'];
function metadataExplanation(pred,meta){const text=decision(pred?.text),structured=decision(pred?.structured);let rule='Insufficient evidence to establish TARGET or NOT TARGET.';if([text,structured].some(x=>x.decision==='TARGET'))rule='Either component being TARGET qualifies metadata as TARGET.';else if([text,structured].every(x=>x.decision==='NOT_TARGET'))rule='Both components classify the listing as NOT TARGET.';const disagree=[text,structured].some(x=>x.decision==='TARGET')&&[text,structured].some(x=>x.decision==='NOT_TARGET');return `<h3>How metadata is combined</h3><div class="cards">${card('Remarks model',text)}${card('Structured model',structured)}</div><p class="small">${esc(rule)}${disagree?' The components disagree.':''}</p><p class="small muted">Keyword quotes above are listing evidence, not measured explanations of the learned prediction.</p><details><summary>All metadata inputs used by this model</summary><div class="facts">${modelFields.map(k=>`<div class="fact"><span>${esc(k)}</span>${esc(meta[k]==null||meta[k]===''?'Missing':Array.isArray(meta[k])?meta[k].join(', ')||'Missing':String(meta[k]))}</div>`).join('')}</div><p class="small muted">These are supplied inputs, not claims about which fields drove this prediction. Price, DOM, sale outcomes, IDs and geography are excluded from this condition head.</p></details>`;}
function opportunityUI(){return `<details class="panel"><summary>Opportunity estimate · manual comp calculator</summary><p class="small muted">Separate from condition scoring. Inputs are temporary and are not saved. Use an adjusted resale estimate from the strongest relevant comp, not the highest-priced sale.</p><div class="facts"><label>Purchase price<input id="oppPurchase" type="number" min="0"></label><label>Estimated resale value<input id="oppValue" type="number" min="0"></label><label>Comp quality<select id="oppGrade"><option value="">Choose grade</option><option>A</option><option>B</option><option>C</option></select></label><label>Distance (miles)<input id="oppDistance" type="number" min="0" step="0.1"></label><label>Rehab cost (optional)<input id="oppRehab" type="number" min="0"></label><label>Selling / financing / holding costs<input id="oppCosts" type="number" min="0"></label></div><label class="small">Why this comp matches<input id="oppReason" type="text" placeholder="Same HOA/layout or closest comparable home"></label><div id="oppResult" role="status"></div><p class="small muted">Grade describes comp quality, not certainty of profit. For condos, verify the HOA and layout match. Unknown interior condition and missing costs remain unresolved.</p></details>`;}
function setupOpportunity(){const ids=['oppPurchase','oppValue','oppGrade','oppDistance','oppRehab','oppCosts','oppReason'];const saved=Number(event()?.metadata_snapshot?.structured?.ListPrice);if(saved>0)$('oppPurchase').value=saved;for(const id of ids)$(id).oninput=()=>{const purchase=Number($('oppPurchase').value),resale=Number($('oppValue').value);if(!(purchase>0&&resale>0)){$('oppResult').textContent='Enter purchase price and estimated resale value to calculate.';return;}const result=OpportunityMath.calculate({purchase,resale,rehab:$('oppRehab').value===''?null:Number($('oppRehab').value),costs:$('oppCosts').value===''?null:Number($('oppCosts').value)});$('oppResult').textContent=`Gross upside: ${dollars(result.grossUpside)} · ${result.discountPercent.toFixed(1)}% below estimated value. ${result.remainingMargin==null?'Remaining margin unavailable until both cost estimates are entered.':'Estimated remaining margin: '+dollars(result.remainingMargin)+'.'} Comp grade: ${$('oppGrade').value||'unassigned'}. Condition uncertainty remains separate.`;};$('oppPurchase').oninput();}
function suggestOverall(){const axes=[$('imageDecision').value,$('metadataDecision').value];$('overallDecision').value=axes.includes('TARGET')?'TARGET':axes.every(v=>v==='NOT_TARGET')?'NOT_TARGET':'INSUFFICIENT_EVIDENCE';}
function remarkSummary(ev){
 const groups=[['Target condition evidence',new Set(['fixer_tlc','deferred_maintenance'])],['Updated evidence',new Set(['remodeled_renovated','turnkey_move_in_ready','updated_finishes'])],['Other opportunity / risk signals',null]];
 const signals=(ev.signals||[]).filter(x=>x.state!=='UNKNOWN'&&x.snippet&&!['room_dimension_boilerplate','occupancy_access','offer_instructions'].includes(x.signal_name));
 let html='<h3>Remark keyword evidence</h3><p class="small muted">Parsed listing evidence, separate from the model prediction. Renovation keywords do not prove the entire home is updated.</p>';
 const condition=new Set([...groups[0][1],...groups[1][1]]);
 for(const [title,allowed] of groups){const rows=signals.filter(x=>allowed?allowed.has(x.signal_name):!condition.has(x.signal_name));if(rows.length)html+=`<div class="small"><strong>${esc(title)}</strong>${rows.map(x=>`<p><span class="pill">${x.source_field==='PrivateRemarks'?'Private remarks':'Public remarks'}</span> ${esc(x.signal_name.replaceAll('_',' '))}${x.state==='ABSENT'?' (negated)':''}: “${esc(x.snippet)}”</p>`).join('')}</div>`;}
 if(!signals.length)html+='<p class="small muted">No parsed keyword evidence available for this saved listing. This does not mean NOT TARGET.</p>';
 return html;
}
function strengthState(){for(const axis of ['image','metadata'])$(axis+'Strength').disabled=$(axis+'Decision').value!=='TARGET';}
function captureAndRender(){const ev=event();ev.review={...(ev.review||{}),image:{decision:$('imageDecision').value,strength:Number($('imageStrength').value)},metadata:{decision:$('metadataDecision').value,strength:Number($('metadataStrength').value)},overall:{decision:$('overallDecision').value},notes:{text:$('notes').value}};render();}
function photoURL(p,thumb=false){return '/api/studio/paired-review/image?evidence='+encodeURIComponent(event().evidence_id)+'&photo='+encodeURIComponent(p.sha256)+(thumb?'&thumbnail=1':'');}
function renderGallery(){const p=photoList[photoIndex];$('gallery').innerHTML=p?`<img class="hero" alt="Listing photo ${photoIndex+1}" src="${photoURL(p)}"><div class="thumbs">${photoList.map((x,i)=>`<button class="${i===photoIndex?'active':''}" data-photo="${i}" aria-label="Photo ${i+1}"><img loading="lazy" alt="Photo ${i+1}" src="${photoURL(x,true)}"></button>`).join('')}</div>`:'<div class="empty">No usable stored photos. You can still test the metadata and remarks.</div>';$('gallery').querySelectorAll('button').forEach(b=>b.onclick=()=>{photoIndex=Number(b.dataset.photo);renderGallery();});const pred=event().prediction?.photos?.find(x=>x.sha256===p?.sha256);$('photoResult').textContent=p?`Photo ${photoIndex+1} of ${photoList.length}${pred?' · '+(names[pred.decision]||'Cannot tell')+(pred.strength?' · '+pred.strength+'/100':''):''}`:'';}
function nextProperty(){if(dirty){message('Save your correction before moving on.',true);return;}const visible=visibleItems();const i=visible.findIndex(x=>x.group_id===current?.group_id);if(i>=0&&i+1<visible.length)loadProperty(visible[i+1].group_id);else message('You reached the end of the list.');}
async function runModel(){try{$('run').disabled=true;const result=await api('predict',{evidence_id:event().evidence_id});if(result.status==='completed'){event().prediction=result;render();message('Model result loaded.');}else{event().request=result;render();message('Scoring this listing. Its result will appear here.');}}catch(e){message(e.message,true);render();}}
async function saveCorrection(next){try{const before=visibleItems(),position=before.findIndex(x=>x.group_id===current.group_id),nextGroup=before[position+1]?.group_id;const ev=event(),payload={evidence_id:ev.evidence_id,expected_revision:ev.revision||0,candidate_id:status.candidate?.candidate_id||null,image:{decision:$('imageDecision').value,strength:Number($('imageStrength').value)},metadata:{decision:$('metadataDecision').value,strength:Number($('metadataStrength').value)},overall:$('overallDecision').value,notes:$('notes').value,excluded_photos:excluded};$('save').disabled=$('saveNext').disabled=true;await api('correct',payload);dirty=false;message('Correction saved. It will be included when you train the next version.');items=(await api('list')).items;renderList();if(next){if(nextGroup)await loadProperty(nextGroup);else{const index=eventIndex;current=await api('property?id='+encodeURIComponent(current.group_id));eventIndex=index;render();message('Correction saved. You reached the end of the filtered list.');}}else{const index=eventIndex;current=await api('property?id='+encodeURIComponent(current.group_id));eventIndex=index;render();}}catch(e){message(e.message,true);$('save').disabled=$('saveNext').disabled=false;}}
async function startTrain(){try{$('train').disabled=true;await api('train',{confirmed:true,dataset_id:status.dataset.id});message('Training queued. Your current candidate remains available while the next version trains.');await refreshStatus();}catch(e){message(e.message,true);$('train').disabled=false;}}
$('train').onclick=startTrain;$('search').oninput=renderList;$('showMissingMLS').onchange=renderList;$('reviewFilter').onchange=renderList;
async function init(){try{await refreshStatus();const list=await api('list');items=list.items;renderList();const first=items.find(x=>hasMLS(x.prior_mls)||hasMLS(x.last_mls));if(first)await loadProperty(first.group_id);}catch(e){message(e.message,true);}}
setInterval(async()=>{if(pending)return;pending=true;try{const previous=status.candidate?.candidate_id;await refreshStatus();const ev=event();if(!dirty&&current&&(previous!==status.candidate?.candidate_id||['queued','running'].includes(ev?.request?.status))){const index=eventIndex;current=await api('property?id='+encodeURIComponent(current.group_id));eventIndex=index;render();}}catch(e){message(e.message,true);}finally{pending=false;}},6000);
init();
</script></body></html>
