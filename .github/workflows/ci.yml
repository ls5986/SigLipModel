name: ActVision CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install -r requirements-label-worker.txt
          pip install pytest
      - name: Compile
        run: python -m compileall -q .
      - name: Contract fixtures
        run: python tools/export_actvision_fixtures.py --check
      - name: Provider Spec Kit project
        run: python -m pytest test_spec_kit_project.py -q
      - name: Contract bundle
        run: |
          python tools/check_actvision_contract_bundle.py
          python -m pytest test_actvision_contract_bundle.py -q
      - name: Backend regression suite
        run: python -m pytest test_actvision_v2.py test_cloud_runtime.py test_hosted_server.py test_hosted_session.py test_model_workbench.py test_bootstrap_diagnostics.py test_v2_startup_recovery.py test_v2_inventory_nonblocking.py test_v2_training_io.py -q

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Training Studio browser regression
        run: node test_training_studio_browser.cjs
      - name: Hosted session request regression
        run: node test_hosted_session_client.cjs
      - name: Hosted account mobile and desktop regression
        run: node test_hosted_session_browser.cjs
