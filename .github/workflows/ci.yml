name: ActVision CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install -r requirements-label-worker.txt
          pip install pytest
      - name: Compile
        run: python -m compileall -q .
      - name: Contract fixtures
        run: python tools/export_actvision_fixtures.py --check
      - name: Backend regression suite
        run: python -m pytest test_actvision_v2.py test_cloud_runtime.py test_hosted_server.py test_model_workbench.py -q
